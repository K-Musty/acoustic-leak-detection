# MIMII Fan machine cross-dataset validation

name: mimii_pump_fixed
dataset: mimii
machine: pump
shot: 5
seed: 42
lr: 0.0001
epochs: 100
episodes_per_epoch: 100
embed_dim: 128
use_self_attention: true
use_cross_attention: true
conformer_kwargs:
  ffn_dim: 256
  num_heads: 4
  num_layers: 4
  kernel_size: 31
data_root: data/processed
