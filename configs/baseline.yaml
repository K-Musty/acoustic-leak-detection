# Baseline: No attention, GPLA only

name: gpla_baseline
dataset: gpla
shot: 5
use_self_attention: false
use_cross_attention: false

# Inherit from base
seed: 42
lr: 0.0001
epochs: 50
episodes_per_epoch: 100
embed_dim: 128
data_root: data/processed
conformer_kwargs:
  ffn_dim: 128
  num_heads: 4
  num_layers: 2
